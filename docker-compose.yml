version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-xiaolvshu-dev
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xiaolvshu
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: redis-xiaolvshu-dev
    ports:
      - "16379:6379"
    volumes:
      - ./docker/redis/data:/data
    command:
      redis-server --appendonly yes

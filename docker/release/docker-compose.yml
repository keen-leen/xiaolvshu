services:
  mysql:
    image: mysql:8.0
    container_name: xiaolvshu-mysql
    ports:
      - "13306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: GaY%A99^>8fc_Kt2YU-G
      MYSQL_DATABASE: xiaolvshu
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - xiaolvshu-net

  redis:
    image: redis:7
    container_name: xiaolvshu-redis
    ports:
      - "16379:6379"
    restart: always
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - xiaolvshu-net
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-xiaolvshu
    ports:
      - "15672:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: xiaolvshu
      RABBITMQ_DEFAULT_PASS: GaY%A99^>8fc_Kt2YU-G
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    networks:
      - xiaolvshu-net

  elasticsearch:
    build:
      context: ../..
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: elasticsearch-xiaolvshu
    ports:
      - "9200:9200"
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD before starting release compose}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD before starting release compose} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - xiaolvshu-net

  backend:
    image: xiaolvshu-backend:2.0.1
    container_name: xiaolvshu-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./backend.enc
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - elasticsearch
    networks:
      - xiaolvshu-net

  nginx:
    image: nginx:stable
    container_name: xiaolvshu-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html/dist:ro
    depends_on:
      - backend
    networks:
      - xiaolvshu-net

networks:
  xiaolvshu-net:
    driver: bridge

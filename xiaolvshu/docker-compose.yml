services:
  mysql:
    image: mysql:8.0
    container_name: xiaolvshu-mysql
    ports:
      - "13306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: GaY%A99^>8fc_Kt2YU-G
      MYSQL_DATABASE: xiaolvshu
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - xiaolvshu-net

  redis:
    image: redis:7
    container_name: xiaolvshu-redis
    ports:
      - "16379:6379"
    restart: always
    volumes:
      - redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - xiaolvshu-net

  backend:
    image: xiaolvshu-backend:latest
    container_name: xiaolvshu-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      - mysql
      - redis
    networks:
      - xiaolvshu-net

  nginx:
    image: nginx:stable
    container_name: xiaolvshu-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html/dist:ro
    depends_on:
      - backend
    networks:
      - xiaolvshu-net

networks:
  xiaolvshu-net:
    driver: bridge

map $http_x_forwarded_proto $xiaolvshu_forwarded_proto {
    # 宿主机 Nginx 是唯一公网入口。只有明确的 http/https 值才允许继续传给后端，
    # 避免客户端构造任意协议字符串，同时兼容本机 SSH 隧道直接访问容器端口。
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 500m;

    # 备案后宿主机 Nginx 会从 Docker bridge 转发请求。只信任 Docker 默认私网段，
    # real_ip_recursive 会从转发链末端选择第一个非可信地址，避免客户端伪造最前面的值。
    # 当前端口只绑定 127.0.0.1 时，公网客户端无法绕过宿主机入口直接命中此容器。
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 容器和部署脚本只检查 Nginx 自身，不把后端瞬时状态混入前端健康状态。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 旅行 Agent 是真实 SSE 流。必须在普通 /api/ 代理规则之前精确匹配，
    # 并关闭 Nginx 的响应缓冲，否则浏览器只能在请求结束后一次性收到正文。
    location = /api/ai/travel/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端会信任这个容器代理传入的地址做 Agent 限流，因此必须覆盖客户端自带的
        # X-Forwarded-For，不能用 proxy_add_x_forwarded_for 把可伪造值继续向后传。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $xiaolvshu_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $xiaolvshu_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

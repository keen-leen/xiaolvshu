# 小旅书统一运行配置
# 开发与发布环境使用相同配置结构，差异全部由启动脚本加载的环境变量提供。

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: xiaolvshu-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/xiaolvshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:xiaolvshu}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:5s}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15672}
    username: ${RABBITMQ_USERNAME:xiaolvshu}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:19200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD}

  ai:
    chat:
      memory:
        repository:
          jdbc:
            # 业务数据库的结构由仓库 schema.sql 和迁移脚本管理，禁止依赖启动时隐式建表。
            initialize-schema: never
    tools:
      # 工具异常必须终止 Advisor 循环，由统一 SSE error 返回安全文案；
      # 不能把异常转换为普通工具文本后继续让模型把它当作可信检索上下文。
      throw-exception-on-error: true
    openai:
      api-key: ${AI_API_KEY}
      # Spring AI 2.0 的 OpenAI Java SDK 会在 base-url 后追加 /chat/completions。
      # DashScope 兼容协议的 API 根路径本身包含 /v1，缺失时会请求
      # /compatible-mode/chat/completions 并返回 404 Unknown。
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        model: ${AI_CHAT_MODEL:qwen-plus}
        temperature: ${AI_TEMPERATURE:0.3}
      embedding:
        model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
      file-size-threshold: 10MB

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

app:
  agent:
    # Agent 会占用模型调用和长连接：同时限制单访问者速率与单实例在途请求数。
    max-concurrent: ${AGENT_MAX_CONCURRENT:8}
    # SSE 心跳用于穿过代理缓冲并及时发现客户端断开；总超时防止无限占用模型与并发许可。
    heartbeat-seconds: ${AGENT_HEARTBEAT_SECONDS:15}
    run-timeout-seconds: ${AGENT_RUN_TIMEOUT_SECONDS:120}
    # 标准 ToolCallingAdvisor 管理循环；请求级 ToolContext 用此上限约束真实 RAG 成本。
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:1}
    # 只有应用确实部署在可信反向代理后时才能打开，否则客户端可伪造 X-Forwarded-For 绕过限流。
    trust-forwarded-headers: ${AGENT_TRUST_FORWARDED_HEADERS:false}
    rate-limit:
      period-seconds: ${AGENT_RATE_LIMIT_PERIOD_SECONDS:60}
      anonymous-max: ${AGENT_RATE_LIMIT_ANONYMOUS_MAX:5}
      authenticated-max: ${AGENT_RATE_LIMIT_AUTHENTICATED_MAX:20}
    memory:
      max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
      retention-days: ${AGENT_MEMORY_RETENTION_DAYS:30}
      cleanup-cron: "${AGENT_MEMORY_CLEANUP_CRON:0 30 3 * * *}"

  jwt:
    secret: ${JWT_SECRET}
    expires-in: 604800000
    refresh-expires-in: 2592000000

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Content-Type,Authorization

  rag:
    top-k: ${RAG_TOP_K:5}
    # 单次 Embedding API 最多发送的文本数；应用内部会再将其限制在 1～10。
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.45}
    # BM25 弱命中先于 RRF 过滤；强单路门槛用于保留没有双路交集的高置信候选。
    bm25-min-score: ${RAG_BM25_MIN_SCORE:2.0}
    bm25-strong-score: ${RAG_BM25_STRONG_SCORE:12.3}
    vector-strong-similarity: ${RAG_VECTOR_STRONG_SIMILARITY:0.55}
    index-prefix: ${RAG_INDEX_PREFIX:xiaolvshu}
    dimensions: ${RAG_VECTOR_DIMENSIONS:1024}
    num-candidates: ${RAG_NUM_CANDIDATES:100}
    candidate-count: ${RAG_CANDIDATE_COUNT:30}
    rrf-rank-constant: ${RAG_RRF_RANK_CONSTANT:60}
    max-chunks-per-post: ${RAG_MAX_CHUNKS_PER_POST:2}

  search:
    index-prefix: ${SEARCH_INDEX_PREFIX:xiaolvshu}

  upload:
    image:
      max-size: 20971520
      allowed-types: image/jpeg,image/jpg,image/png,image/gif,image/webp,image/heic,image/heif
    video:
      max-size: 524288000
      allowed-types: video/mp4,video/mpeg,video/quicktime,video/x-m4v,video/3gpp,video/avi,video/mov

cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  region: ${COS_REGION:ap-beijing}
  bucket-name: ${COS_BUCKET_NAME}
  base-url: ${COS_BASE_URL:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: INFO
    com.xiaolvshu: ${APP_LOG_LEVEL:DEBUG}

script:
  image-migration:
    enabled: false
  password-update:
    enabled: false
